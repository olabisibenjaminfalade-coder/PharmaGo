<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#12483b">
  <title>PharmaGo | Sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <style>
    :root {
      --forest: #12483b;
      --forest-deep: #0d382e;
      --leaf: #c9ef62;
      --paper: #f8f8f3;
      --white: #fff;
      --ink: #1c2925;
      --muted: #707b76;
      --line: #e4e8e1;
      --coral: #e7785f;
      --serif: 'DM Serif Display', Georgia, 'Times New Roman', serif;
      --sans: 'DM Sans', 'Segoe UI', sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--sans);
      background: var(--white);
      color: var(--ink);
    }
    a { color: inherit; text-decoration: none; }
    button, input { font: inherit; }
    .announcement {
      min-height: 34px;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 7px 18px;
      background: var(--forest);
      color: white;
      text-align: center;
      font-size: 11px;
      letter-spacing: .35px;
    }
    .announcement strong { color: var(--leaf); font-weight: 700; }
    .site-header {
      background: var(--white);
      border-bottom: 1px solid var(--line);
    }
    .shell { width: min(1180px, calc(100% - 48px)); margin: 0 auto; }
    .header-main {
      position: relative;
      min-height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -.7px;
      color: var(--forest);
    }
    .brand-mark { width: auto; height: 40px; }
    .text-link {
      position: absolute;
      right: 0;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 0 9px 12px;
      color: var(--forest);
      font-size: 12px;
      font-weight: 700;
    }
    .text-link svg { width: 16px; height: 16px; }
    .auth-page {
      min-height: calc(100vh - 104px);
      padding: 46px 24px 64px;
    }
    .auth-card {
      width: min(460px, 100%);
      margin: 0 auto;
    }
    .auth-form-wrap {
      padding: 0;
    }
    .form-header {
      margin-bottom: 25px;
      text-align: center;
    }
    .form-header h2 {
      margin: 0 0 12px;
      font-size: 29px;
      font-weight: 500;
      letter-spacing: -.6px;
      color: #303633;
    }
    .form-header p {
      max-width: 440px;
      margin: 0 auto;
      color: #4e5551;
      font-size: 14px;
      line-height: 1.65;
    }
    form {
      display: grid;
      gap: 13px;
    }
    .field {
      display: grid;
      gap: 7px;
      font-size: 12px;
      font-weight: 700;
      color: #46524c;
    }
    .field input {
      width: 100%;
      min-height: 48px;
      padding: 0 14px;
      border: 1px solid #dfe5dd;
      border-radius: 4px;
      background: #fff;
      color: var(--ink);
      outline: none;
    }
    .field input:focus {
      border-color: var(--forest);
      box-shadow: 0 0 0 3px rgba(18,72,59,.12);
    }
    .password-heading {
      margin: 34px 0 20px;
      text-align: center;
      font-size: 16px;
      font-weight: 700;
    }
    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }
    .checkbox-row input {
      width: 16px;
      height: 16px;
      accent-color: var(--forest);
    }
    .primary-button {
      min-height: 48px;
      border: 0;
      border-radius: 999px;
      background: var(--forest);
      color: white;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: transform .18s ease, background .2s ease;
    }
    .primary-button:hover {
      background: var(--forest-deep);
      transform: translateY(-1px);
    }
    .subtle {
      margin: 19px 0 0;
      color: var(--muted);
      text-align: center;
      font-size: 12px;
    }
    .subtle a {
      color: var(--forest);
      font-weight: 700;
    }
    .success-message {
      min-height: 18px;
      margin: 0;
      color: var(--forest);
      text-align: center;
      font-size: 12px;
      font-weight: 700;
    }
    @media (max-width: 760px) {
      .shell { width: calc(100% - 32px); }
      .header-main { min-height: 64px; }
      .brand { font-size: 19px; }
      .brand-mark { height: 34px; }
      .text-link { font-size: 0; }
      .text-link svg { width: 20px; height: 20px; }
      .auth-page { padding: 38px 20px 48px; }
      .form-header h2 { font-size: 27px; }
    }
  </style>
</head>
<body>
  <div class="announcement">Thoughtful care, right to your door. <strong>&nbsp; Free delivery on orders over N25,000</strong></div>

  <header class="site-header">
    <div class="shell header-main">
      <a class="brand" href="index.html" aria-label="PharmaGo home">
        <img class="brand-mark" src="gom.png" alt="PharmaGo logo">
        <span>PharmaGo</span>
      </a>
      <a class="text-link" href="index.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h18M10 5l-7 7 7 7"/></svg>
        <span>Back to home</span>
      </a>
    </div>
  </header>

  <main class="auth-page">
    <section class="auth-card" aria-labelledby="signin-title">
      <div class="auth-form-wrap">
        <div class="form-header" id="signin-title">
          <h2>Sign in</h2>
          <p>Sign in to your PharmaGo account to manage your orders and care essentials.</p>
        </div>

        <form id="signin-form" novalidate>
          <div class="field">
            <label for="email">Email address</label>
            <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required>
          </div>
          <label class="checkbox-row">
            <input type="checkbox" name="remember" checked>
            <span>Keep me signed in</span>
          </label>
          <button class="primary-button" type="submit">Sign in</button>
          <p id="success-message" class="success-message" aria-live="polite"></p>
          <p class="subtle">New here? <a href="signup.html">Create an account</a></p>
        </form>
      </div>
    </section>
  </main>

  <script>
    const form = document.getElementById('signin-form');
    const successMessage = document.getElementById('success-message');

    form.addEventListener('submit', function (event) {
      event.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        successMessage.textContent = 'Please enter both your email and password.';
        successMessage.style.color = '#b94d3d';
        return;
      }

      if (password.length < 6) {
        successMessage.textContent = 'Password must be at least 6 characters long.';
        successMessage.style.color = '#b94d3d';
        return;
      }

      successMessage.textContent = 'Signed in successfully. Welcome back!';
      successMessage.style.color = '#12483b';
      window.location.href = 'registered.html';
    });
  </script>
</body>
</html>
